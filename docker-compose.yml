services:
  postgres:
    image: postgres:16-alpine
    container_name: stackline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stackline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stackline"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stackline-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stackline?schema=public
      SESSION_SECRET: replace-me-with-a-long-random-secret-change-this
      DEMO_USER_PASSWORD: Stackline!Local2026
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: ["sh", "./scripts/docker-dev-entrypoint.sh"]

volumes:
  postgres-data:
